services:
  app:
    image: ${ECR_REGISTRY}/sneakers-app:${IMAGE_TAG}
    container_name: sneakers-webapp

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    networks:
      - sneakers-network

networks:
  sneakers-network:
    driver: bridge