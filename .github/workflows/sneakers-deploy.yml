
name: Sneakers CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "sneakers-ecommerce-website/**"
      - "docker-compose.yml"
      - ".github/workflows/sneakers-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 926337676555.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: sneakers-app

jobs:
  build:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            ./sneakers-ecommerce-website

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image to Amazon ECR
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

  
  deploy:
    name: Deploy to EC2 through SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to both EC2 instances through SSM
        env:
          INSTANCE_ID_1: ${{ secrets.EC2_INSTANCE_ID_1 }}
          INSTANCE_ID_2: ${{ secrets.EC2_INSTANCE_ID_2 }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for INSTANCE_ID in "$INSTANCE_ID_1" "$INSTANCE_ID_2"; do
            if [[ -z "$INSTANCE_ID" ]]; then
              echo "An EC2 instance ID secret is empty."
              exit 1
            fi

            echo "Deploying to $INSTANCE_ID"

            REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          cd /home/ec2-user/sneakers-app

          test -f .env || {
            echo "Application .env file is missing."
            exit 1
          }

          export AWS_REGION="eu-west-1"
          export ECR_REGISTRY="926337676555.dkr.ecr.eu-west-1.amazonaws.com"
          export IMAGE_TAG="__IMAGE_TAG__"

          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

          sudo env ECR_REGISTRY="$ECR_REGISTRY" IMAGE_TAG="$IMAGE_TAG" \
            docker compose pull app

          sudo env ECR_REGISTRY="$ECR_REGISTRY" IMAGE_TAG="$IMAGE_TAG" \
            docker compose up -d --no-deps app

          for attempt in $(seq 1 12); do
            if curl --fail --silent http://localhost:5000/ >/dev/null; then
              echo "Application health check passed."
              sudo docker image prune -f
              exit 0
            fi
            sleep 5
          done

          echo "Application health check failed."
          sudo docker compose logs --tail=100 app
          exit 1
          REMOTE
          )

            REMOTE_SCRIPT="${REMOTE_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"
            COMMAND_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=echo $COMMAND_B64 | base64 -d | bash" \
              --timeout-seconds 600 \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM command ID: $COMMAND_ID"

            for attempt in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true)

              case "$STATUS" in
                Success)
                  echo "Deployment succeeded on $INSTANCE_ID"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query 'StandardOutputContent' \
                    --output text
                  break
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  echo "Deployment failed: $STATUS"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                    --output json
                  exit 1
                  ;;
                *)
                  if [[ "$attempt" -eq 60 ]]; then
                    echo "Timed out waiting for deployment on $INSTANCE_ID"
                    exit 1
                  fi
                  sleep 5
                  ;;
              esac
            done
          done

