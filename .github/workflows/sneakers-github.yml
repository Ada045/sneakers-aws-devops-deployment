name: Deploy Sneakers to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'sneakers-ecommerce-website/**'
      - '.github/workflows/sneakers-github.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: snaekers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Sneakers
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: sneakers-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check GitHub repository and branch
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch reference: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./sneakers-ecommerce-website
          file: ./sneakers-ecommerce-website/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/sneakers-app:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2 through SSM
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: bash ./deploy.sh
